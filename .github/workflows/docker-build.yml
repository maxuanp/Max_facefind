name: docker-build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# 只读仓库内容，不使用任何自定义密钥；登录 registry 也不需要（仅本地构建）
permissions:
  contents: read

concurrency:
  group: docker-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  cpu:
    name: CPU image (build + smoke)
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - name: 清理 runner 磁盘
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
          sudo apt-get clean
          df -h /

      - name: 构建 CPU 镜像
        run: |
          docker build \
            --build-arg BASE=ubuntu:22.04 \
            --build-arg INSTALL_GPU=0 \
            -t facefind:cpu .

      - name: 冒烟（包可导入）
        run: docker run --rm facefind:cpu python3 -c "import facefind; print('ok')"

  gpu:
    name: GPU image (build only, no push)
    runs-on: ubuntu-latest
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@v4

      - name: 清理 runner 磁盘
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
          sudo apt-get clean
          df -h /

      - name: 构建 GPU 镜像（CUDA 12.4 + cuDNN 9）
        run: |
          docker build \
            --build-arg INSTALL_GPU=1 \
            -t facefind:gpu .

      - name: 冒烟（包可导入，无 GPU 也可）
        run: docker run --rm facefind:gpu python3 -c "import facefind; print('ok')"
